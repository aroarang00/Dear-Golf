name: Firestore Rules Tests

# 일정전파(scheduleGroups)·내일정(schedules)·라운지모집(roundups) 보안 규칙 회귀 테스트.
#   규칙 또는 테스트가 바뀐 PR/푸시에서 에뮬레이터로 false-denial을 자동 검증한다.
#   로컬엔 Java가 없어 직접 못 돌리므로, 이 클라우드 잡이 사실상의 실행 환경.

on:
  push:
    branches: ['**']
    paths:
      - 'firestore.rules'
      - 'test/rules/**'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'
      - 'package.json'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'test/rules/**'
      - 'firebase.json'
      - '.github/workflows/firestore-rules.yml'

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Firestore 에뮬레이터는 JVM 필요(Java 11+)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 에뮬레이터를 띄운 채 규칙 테스트 실행. demo- 접두 프로젝트라 실 자격증명 불필요.
      - name: Run Firestore rules tests
        run: firebase emulators:exec --only firestore --project demo-deargolf "npm run test:rules"
