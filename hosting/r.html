<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dear Golf — 라운딩 초대</title>
  <meta name="description" content="좋은 동반자와 함께할 그날의 라운드, 디어골프에서 확인하세요." />
  <!-- 공유 미리보기(카톡 등) — 골프장 사진 카드 톤(og-roundup.jpg). 모집 상세는 친구공개라 비노출, 브랜드 카드만. -->
  <meta property="og:title" content="Dear Golf — 라운딩 초대" />
  <!-- 슬로건을 앞에 둬서 카톡이 설명 끝을 잘라도 '…특별하게'가 안 잘리게(끝은 부차적 문구). 사용자 2026-06-17 -->
  <meta property="og:description" content="라운딩의 모든 순간을 더 특별하게 · 앱에서 모집을 확인하고 함께해요" />
  <meta property="og:image" content="https://deargolf.app/og-card-v2.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 브랜드 워드마크 = Lora Medium Italic (앱 홈 F.brand와 동일 폰트·기울기) -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500&display=swap" rel="stylesheet" />
  <style>
    /* 맑은 하늘·나무 코스 사진(hero.jpg, 원래 텍스트링크 이미지) + 옅은 다크 오버레이 — 밝게 유지 (사용자 2026-06-16) */
    :root{
      --gold:#E6C677; --gold-dk:#B68F49; --gold-lt:#F4E2A8;
      --white:#FFFFFF; --ivory:#F2EEE4; --ivory-dim:rgba(242,238,228,.85);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
      color:var(--ivory);
      min-height:100%;
      background:
        linear-gradient(180deg, rgba(6,18,12,.22) 0%, rgba(6,18,12,.40) 52%, rgba(6,18,12,.66) 100%),
        url("/hero.jpg") center/cover no-repeat fixed;
      display:flex; align-items:center; justify-content:center;
      padding:44px 24px;
      text-shadow:0 1px 5px rgba(0,0,0,.6);
    }
    .wrap{ width:100%; max-width:320px; text-align:center; }
    .word{ font-size:21px; letter-spacing:8px; color:var(--gold); font-weight:700; margin-bottom:18px; }
    .brand{ font-family:"Lora",Georgia,serif; font-style:italic; font-weight:500;
      font-size:clamp(48px,16vw,62px); line-height:1.04; color:var(--white); margin-bottom:16px; }
    .slogan{ font-size:15px; letter-spacing:.4px; color:var(--ivory); line-height:1.6; margin-bottom:34px; }
    .btns{ display:flex; flex-direction:column; gap:10px; max-width:264px; margin:0 auto; }
    a.btn{ display:block; text-decoration:none; border-radius:13px; padding:14px; font-size:15px; font-weight:700;
      letter-spacing:.2px; text-shadow:none; }
    .btn-primary{ background:linear-gradient(180deg, var(--gold-lt) 0%, #DAB76B 48%, var(--gold-dk) 100%); color:#16303F;
      box-shadow:0 12px 26px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.55); }
    .btn-store{ background:rgba(255,255,255,.12); color:var(--ivory); border:1px solid rgba(255,255,255,.30);
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); box-shadow:0 8px 18px rgba(0,0,0,.32); font-size:14px; padding:13px; }
    .stripe{ display:flex; height:3px; width:56px; margin:30px auto 0; border-radius:2px; overflow:hidden; box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .stripe i{ flex:1; }
    .foot{ margin-top:15px; font-size:12px; letter-spacing:1px; color:rgba(242,238,228,.6); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="word">라운딩 초대</div>
    <div class="brand">Dear Golf</div>
    <div class="slogan">라운딩의 모든 순간을 더 특별하게</div>
    <div class="btns">
      <a class="btn btn-primary" id="openApp" href="#">앱에서 열기</a>
      <a class="btn btn-store" href="https://apps.apple.com/app/id6770383793">App Store에서 받기</a>
      <a class="btn btn-store" href="https://play.google.com/store/apps/details?id=app.deargolf">Google Play에서 받기</a>
    </div>
    <div class="stripe"><i style="background:#ECD884"></i><i style="background:#B2CADD"></i><i style="background:#6B1E2A"></i></div>
    <div class="foot">deargolf.app</div>
  </div>
  <script>
    // 경로에서 모집 id 추출 (/r/{postId}) — 앱 스킴으로 열기 시도에만 사용. 모집 상세는 비노출.
    (function () {
      var m = location.pathname.match(/\/r\/([^\/?#]+)/);
      var id = m ? m[1] : '';
      // 앱 설치돼 있으면 Universal/App Links가 이 페이지 전에 앱을 가로채므로, 여기 도달=대개 미설치.
      // 그래도 '앱에서 열기'는 스킴으로 한 번 더 시도(설치됐는데 링크검증 안 된 경우 커버).
      document.getElementById('openApp').setAttribute('href', 'deargolf://r/' + id);
    })();
  </script>
</body>
</html>
