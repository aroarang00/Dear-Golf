<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dear Golf — 라운딩 초대</title>
  <meta name="description" content="좋은 동반자와 함께할 그날의 라운드, 디어골프에서 확인하세요." />
  <!-- 공유 미리보기(카톡 등) — 골프장 사진 카드 톤(og-card-v5.jpg, 워드마크 확대판). 모집 상세는 친구공개라 비노출, 브랜드 카드만.
       ※ 이 og: 문구는 카톡 공유 미리보기용으로 따로 튜닝됨(아래 주석) — 페이지 본문 문구와 별개로 유지. -->
  <meta property="og:title" content="Dear Golf — 라운딩 초대" />
  <!-- 카톡이 description '맨 끝 한 글자'를 깎음(게→요 확인). 짧게 줄여 잘릴 확률↓ + 끝에 버릴 글자 ⛳로
       혹시 깎여도 본문 온전. 슬로건은 공식 '더 특별하게' 유지([[brand-slogan]]). 사용자 2026-06-17 -->
  <meta property="og:description" content="라운딩의 모든 순간을 더 특별하게 · 앱에서 모집을 확인하세요 ⛳" />
  <meta property="og:image" content="https://deargolf.app/og-card-v5.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#FAF6EC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 메인 랜딩과 동일 폰트 — Lora(워드마크 이탤릭) + Pretendard(본문) -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* 메인 랜딩(index.html)과 동일 결·문구 — 크림 배경·차콜 Lora 워드마크·삼색 스트라이프.
       ★버튼은 그라데이션·광택·이중 그림자 효과 전부 빼고 '플랫 네이비 단색'으로 통일(사용자 2026-07-01 "촌스럽다"). */
    :root{
      --cream:#FAF6EC; --butter:#F5E6A8; --paleSky:#C8D9E6;
      --burgundy:#6B1E2A; --charcoal:#3D3935; --navy:#1A3D52;
      --butter-tint:#FCF4D2; --sky-tint:#DCE9F2; --cream-soft:#FBF4D9;
      --hairline:rgba(61,57,53,0.12);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:'Pretendard','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      color:var(--charcoal);
      background:
        radial-gradient(95% 70% at 12% 0%, var(--butter-tint) 0%, rgba(252,244,210,0) 52%),
        radial-gradient(90% 70% at 100% 6%, var(--sky-tint) 0%, rgba(220,233,242,0) 56%),
        radial-gradient(120% 80% at 50% 100%, var(--cream-soft) 0%, rgba(251,244,217,0) 60%),
        var(--cream);
      background-attachment:fixed;
      min-height:100%;
      display:flex; align-items:center; justify-content:center;
      padding:48px 26px;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      word-break:keep-all;
    }
    /* 상단 브랜드 삼색바 — 아주 얇게 (index.html과 동일) */
    .stripe{ position:fixed; left:0; right:0; top:0; height:4px; display:flex; z-index:10; }
    .stripe i{ flex:1; }
    .wrap{ width:100%; max-width:340px; text-align:center;
      opacity:0; transform:translateY(14px); animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s forwards; }
    @keyframes rise{ to{ opacity:1; transform:none; } }

    /* 헤더 문구 — index.html 히어로와 동일 카피(우리의 빛나는 아카이브 / For Your Ultimate Golf Life / 더 특별하게) */
    .subtitle{ font-weight:400; font-size:clamp(14px,4vw,16px); letter-spacing:2px; color:rgba(61,57,53,0.78); margin-bottom:18px; }
    .wordmark{ font-family:'Lora',Georgia,serif; font-style:italic; font-weight:400;
      font-size:clamp(52px,16vw,72px); line-height:1.05; color:var(--charcoal); letter-spacing:-.5px; }
    .brand-sub{ margin-top:14px; font-weight:500; font-size:clamp(12px,3.4vw,14px); letter-spacing:2.5px; color:var(--burgundy); opacity:.78; }
    .mini-stripe{ display:flex; width:100px; height:3px; margin:24px auto 20px; border-radius:2px; overflow:hidden; }
    .mini-stripe i{ flex:1; }
    .tagline{ font-size:clamp(17px,4.8vw,19px); font-weight:300; line-height:1.6; color:var(--charcoal); letter-spacing:.2px; }
    .tagline b{ color:var(--burgundy); font-weight:500; }

    /* 버튼 — 플랫 네이비 단색(그라데이션·광택·그림자·호버 리프트 없음). 링크 열기=조금 크게 강조, 스토어=동일 톤 */
    .btns{ display:flex; flex-direction:column; gap:11px; margin:38px auto 0; max-width:300px; }
    a.btn{ display:flex; align-items:center; justify-content:center; gap:10px; text-decoration:none;
      border-radius:14px; font-weight:500; letter-spacing:.2px; background:var(--navy); color:#fff; }
    /* ★a.btn-app (요소+클래스)로 특정도를 a.btn과 맞춰야 background가 덮인다 — .btn-app(클래스만)이면 a.btn 네이비가 이김 */
    a.btn-app{ padding:17px 22px; font-size:16px; background:var(--burgundy); } /* 주 액션 — 스토어(네이비)와 구분되게 버건디 */
    .btn-store{ padding:15px 22px; font-size:14.5px; }
    .btn .ico{ width:19px; height:19px; flex:none; fill:var(--butter); }
    @media (hover:hover){ a.btn:hover{ opacity:.92; } }

    .foot{ margin-top:32px; font-size:15px; font-weight:600; letter-spacing:1px; color:var(--navy); opacity:.9; }
  </style>
</head>
<body>
  <div class="stripe"><i style="background:#ECD884"></i><i style="background:#B2CADD"></i><i style="background:#6B1E2A"></i></div>
  <div class="wrap">
    <div class="subtitle">우리의 빛나는 아카이브</div>
    <div class="wordmark">Dear&nbsp;Golf</div>
    <div class="brand-sub">For Your Ultimate Golf Life</div>
    <div class="mini-stripe"><i style="background:#ECD884"></i><i style="background:#B2CADD"></i><i style="background:#6B1E2A"></i></div>
    <div class="tagline">라운딩의 모든 순간을 <b>더 특별하게</b></div>

    <div class="btns">
      <a class="btn btn-app" id="openApp" href="#">앱에서 열기</a>
      <a class="btn btn-store" href="https://apps.apple.com/app/id6770383793">
        <svg class="ico" viewBox="0 0 24 24"><path d="M16.4 12.9c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .6 1 1.4 2.1 2.4 2 .9 0 1.3-.6 2.4-.6s1.4.6 2.4.6c1 0 1.7-1 2.3-2 .7-1.1 1-2.2 1-2.2-.1 0-2-.8-1.9-3.1zM14.6 6.7c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg>
        App Store · iOS 다운로드
      </a>
      <a class="btn btn-store" href="https://play.google.com/store/apps/details?id=app.deargolf">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 4.5l8.6 8.6L5 21.7c-.3-.2-.5-.6-.5-1V5.5c0-.4.2-.8.5-1zM15 14.5l2.6 2.6-9.4 5.3 6.8-7.9zm0-3l-6.8-7.9 9.4 5.3L15 11.5zm1.4 1.4l2.6-1.5c.6-.4.6-1.4 0-1.8l-2.6-1.5-2.1 2.4 2.1 2.4z"/></svg>
        Google Play · Android 다운로드
      </a>
    </div>
    <div class="foot">deargolf.app</div>
  </div>
  <script>
    // 경로에서 모집 id 추출 (/r/{postId}) — 앱 스킴으로 열기 시도에만 사용. 모집 상세는 비노출.
    (function () {
      var m = location.pathname.match(/\/r\/([^\/?#]+)/);
      var id = m ? m[1] : '';
      // 앱 설치돼 있으면 Universal/App Links가 이 페이지 전에 앱을 가로채므로, 여기 도달=대개 미설치.
      // 그래도 '앱에서 열기'는 스킴으로 한 번 더 시도(설치됐는데 링크검증 안 된 경우 커버).
      document.getElementById('openApp').setAttribute('href', 'deargolf://r/' + id);
    })();
  </script>
</body>
</html>
