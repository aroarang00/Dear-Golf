<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Dear Golf — 라운딩 초대</title>
  <meta name="description" content="좋은 동반자와 함께할 그날의 라운드, 디어골프에서 확인하세요." />
  <!-- 공유 미리보기(카톡 등) — 골프장 사진 카드 톤(og-card-v2.jpg). 모집 상세는 친구공개라 비노출, 브랜드 카드만. -->
  <meta property="og:title" content="Dear Golf — 라운딩 초대" />
  <!-- 카톡이 description '맨 끝 한 글자'를 깎음(게→요 확인). 짧게 줄여 잘릴 확률↓ + 끝에 버릴 글자 ⛳로
       혹시 깎여도 본문 온전. 슬로건은 공식 '더 특별하게' 유지([[brand-slogan]]). 사용자 2026-06-17 -->
  <meta property="og:description" content="라운딩의 모든 순간을 더 특별하게 · 앱에서 모집을 확인하세요 ⛳" />
  <meta property="og:image" content="https://deargolf.app/og-card-v2.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#FAF6EC" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- 메인 랜딩과 동일 폰트 — Lora(워드마크 이탤릭) + Pretendard(본문) -->
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* 메인 랜딩(index.html)과 같은 결 — 크림 배경·차콜 Lora 워드마크·네이비 글래스 버튼. 골드 베벨/사진배경 폐기(2026-06-17 사용자 "만화 같다") */
    :root{
      --cream:#FAF6EC; --butter:#F5E6A8; --paleSky:#C8D9E6;
      --burgundy:#6B1E2A; --charcoal:#3D3935; --navy:#1A3D52;
      --butter-tint:#FCF4D2; --sky-tint:#DCE9F2; --cream-soft:#FBF4D9;
      --charcoal-soft:rgba(61,57,53,0.62); --charcoal-faint:rgba(61,57,53,0.40);
      --hairline:rgba(61,57,53,0.12);
    }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      font-family:'Pretendard','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      color:var(--charcoal);
      background:
        radial-gradient(95% 70% at 12% 0%, var(--butter-tint) 0%, rgba(252,244,210,0) 52%),
        radial-gradient(90% 70% at 100% 6%, var(--sky-tint) 0%, rgba(220,233,242,0) 56%),
        radial-gradient(120% 80% at 50% 100%, var(--cream-soft) 0%, rgba(251,244,217,0) 60%),
        var(--cream);
      background-attachment:fixed;
      min-height:100%;
      display:flex; align-items:center; justify-content:center;
      padding:48px 26px;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      word-break:keep-all;
    }
    /* 상단 브랜드 삼색바 — 아주 얇게 */
    .stripe{ position:fixed; left:0; right:0; top:0; height:4px; display:flex; z-index:10; }
    .stripe i{ flex:1; }
    .wrap{ width:100%; max-width:340px; text-align:center;
      opacity:0; transform:translateY(14px); animation:rise .9s cubic-bezier(.2,.7,.2,1) .05s forwards; }
    @keyframes rise{ to{ opacity:1; transform:none; } }

    .eyebrow{ font-size:15px; font-weight:600; letter-spacing:4px; color:var(--burgundy); opacity:.92; margin-bottom:20px; }
    .wordmark{ font-family:'Lora',Georgia,serif; font-style:italic; font-weight:400;
      font-size:clamp(54px,17vw,74px); line-height:1.04; color:var(--charcoal); letter-spacing:-.5px; }
    .mini-stripe{ display:flex; width:96px; height:3px; margin:22px auto 20px; border-radius:2px; overflow:hidden; }
    .mini-stripe i{ flex:1; }
    .slogan{ font-size:clamp(16px,4.6vw,18px); font-weight:300; line-height:1.6; color:var(--charcoal); letter-spacing:.2px; }
    .slogan b{ color:var(--burgundy); font-weight:500; }

    /* 버튼 폭 줄여 가운데로 모음 — 더 단정하게 */
    .btns{ display:flex; flex-direction:column; gap:12px; margin:38px auto 0; max-width:268px; }
    a.btn{ display:flex; align-items:center; justify-content:center; gap:9px; text-decoration:none;
      border-radius:14px; font-weight:500; letter-spacing:.2px; transition:transform .15s, box-shadow .2s, filter .2s; }
    /* 주 CTA — 네이비 글래스 + 입체감(상단 하이라이트·하단 음영·이중 그림자) */
    .btn-app{ padding:17px 22px; font-size:16px; color:#fff;
      background:linear-gradient(160deg, rgba(45,92,120,1) 0%, rgba(26,61,82,1) 58%, rgba(17,44,58,1) 100%);
      border:1px solid rgba(70,108,132,0.7);
      box-shadow:0 20px 38px rgba(20,49,64,0.34), 0 5px 12px rgba(20,49,64,0.26),
        inset 0 1.5px 0 rgba(255,255,255,0.22), inset 0 -2.5px 5px rgba(8,28,40,0.45); }
    .btn-app:hover{ transform:translateY(-2px); filter:brightness(1.06);
      box-shadow:0 26px 48px rgba(20,49,64,0.4), 0 6px 14px rgba(20,49,64,0.28), 0 0 0 1px rgba(245,230,168,0.3),
        inset 0 1.5px 0 rgba(255,255,255,0.24), inset 0 -2.5px 5px rgba(8,28,40,0.45); }
    .btn-app:active{ transform:translateY(1px) scale(.99);
      box-shadow:0 10px 20px rgba(20,49,64,0.3), inset 0 1.5px 0 rgba(255,255,255,0.18), inset 0 -2px 4px rgba(8,28,40,0.5); }
    /* 스토어 — 네이비 색감 카드(보조지만 또렷이 보이게). 옅은 스카이 그라데이션 + 네이비 보더·글자 */
    .btn-store{ padding:14px 22px; font-size:14px; color:var(--navy); font-weight:600;
      background:linear-gradient(180deg, #FFFFFF 0%, #E6F0F6 100%);
      border:1px solid rgba(26,61,82,0.32);
      box-shadow:0 10px 22px rgba(26,61,82,0.12), 0 2px 5px rgba(26,61,82,0.07),
        inset 0 1px 0 rgba(255,255,255,0.92); }
    .btn-store:hover{ transform:translateY(-1.5px); border-color:rgba(26,61,82,0.5);
      box-shadow:0 14px 28px rgba(26,61,82,0.17), 0 2px 6px rgba(26,61,82,0.08), inset 0 1px 0 rgba(255,255,255,0.95); }
    .btn-store:active{ transform:translateY(0); }
    .btn .ico{ width:18px; height:18px; flex:none; }

    .foot{ margin-top:32px; font-size:16px; font-weight:600; letter-spacing:1px; color:var(--navy); opacity:.9; }
  </style>
</head>
<body>
  <div class="stripe"><i style="background:#ECD884"></i><i style="background:#B2CADD"></i><i style="background:#6B1E2A"></i></div>
  <div class="wrap">
    <div class="eyebrow">라운딩 초대</div>
    <div class="wordmark">Dear&nbsp;Golf</div>
    <div class="mini-stripe"><i style="background:#ECD884"></i><i style="background:#B2CADD"></i><i style="background:#6B1E2A"></i></div>
    <div class="slogan">라운딩의 모든 순간을 <b>더 특별하게</b></div>

    <div class="btns">
      <a class="btn btn-app" id="openApp" href="#">앱에서 열기</a>
      <a class="btn btn-store" href="https://apps.apple.com/app/id6770383793">
        <svg class="ico" viewBox="0 0 24 24" fill="#1A3D52"><path d="M16.4 12.9c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .6 1 1.4 2.1 2.4 2 .9 0 1.3-.6 2.4-.6s1.4.6 2.4.6c1 0 1.7-1 2.3-2 .7-1.1 1-2.2 1-2.2-.1 0-2-.8-1.9-3.1zM14.6 6.7c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg>
        App Store에서 받기
      </a>
      <a class="btn btn-store" href="https://play.google.com/store/apps/details?id=app.deargolf">
        <svg class="ico" viewBox="0 0 24 24" fill="#1A3D52"><path d="M5 4.5l8.6 8.6L5 21.7c-.3-.2-.5-.6-.5-1V5.5c0-.4.2-.8.5-1zM15 14.5l2.6 2.6-9.4 5.3 6.8-7.9zm0-3l-6.8-7.9 9.4 5.3L15 11.5zm1.4 1.4l2.6-1.5c.6-.4.6-1.4 0-1.8l-2.6-1.5-2.1 2.4 2.1 2.4z"/></svg>
        Google Play에서 받기
      </a>
    </div>
    <div class="foot">deargolf.app</div>
  </div>
  <script>
    // 경로에서 모집 id 추출 (/r/{postId}) — 앱 스킴으로 열기 시도에만 사용. 모집 상세는 비노출.
    (function () {
      var m = location.pathname.match(/\/r\/([^\/?#]+)/);
      var id = m ? m[1] : '';
      // 앱 설치돼 있으면 Universal/App Links가 이 페이지 전에 앱을 가로채므로, 여기 도달=대개 미설치.
      // 그래도 '앱에서 열기'는 스킴으로 한 번 더 시도(설치됐는데 링크검증 안 된 경우 커버).
      document.getElementById('openApp').setAttribute('href', 'deargolf://r/' + id);
    })();
  </script>
</body>
</html>
