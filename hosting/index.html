<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dear Golf — 골프 동반자와 라운딩, 한 번에</title>
<meta name="description" content="골프 동반자 매칭·라운딩 일정·기록을 한 앱에서. Dear Golf 다운로드." />
<meta property="og:title" content="Dear Golf" />
<meta property="og:description" content="골프 동반자와 라운딩, 한 번에" />
<meta property="og:url" content="https://deargolf.app" />
<style>
  :root {
    --navy:#1A3D52; --butter:#F5E6A8; --ink:#2A2622;
    --gray:#6B6660; --bg:#FAF6EC; --hairline:#E0DAC8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.6;
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:32px 24px; text-align:center;
  }
  .logo {
    font-family:'Georgia', 'Times New Roman', serif;
    font-size:52px; color:var(--navy); letter-spacing:-1px;
    margin-bottom:6px; font-weight:600;
  }
  .tagline {
    font-size:13px; color:var(--gray); margin-bottom:40px;
    letter-spacing:1.5px; text-transform:lowercase;
  }
  .hero {
    font-size:17px; color:var(--ink); margin-bottom:36px;
    line-height:1.8; max-width:320px;
  }
  .auto-redirect-msg {
    font-size:13px; color:var(--gray); margin-bottom:24px;
    min-height:20px;
  }
  .stores { display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px; }
  .store-btn {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 24px; border-radius:12px; text-decoration:none;
    font-size:15px; font-weight:600;
    transition:transform 0.1s ease, opacity 0.1s ease;
  }
  .store-btn:active { transform:scale(0.98); opacity:0.85; }
  .store-ios { background:#000; color:#fff; }
  .store-android { background:var(--navy); color:#fff; }
  .footer {
    margin-top:48px; font-size:12px; color:var(--gray);
    display:flex; flex-direction:column; gap:6px;
  }
  .footer a { color:var(--gray); text-decoration:underline; }
  @media (max-height: 600px) {
    .hero { margin-bottom:24px; }
    .footer { margin-top:32px; }
  }
</style>
</head>
<body>
  <div class="logo">Dear Golf</div>
  <div class="tagline">deargolf.app</div>
  <div class="hero">
    골프 동반자 매칭부터<br />
    라운딩 기록까지 — 한 앱에서
  </div>
  <div class="auto-redirect-msg" id="msg"></div>
  <div class="stores">
    <a id="ios-link" class="store-btn store-ios" href="#" rel="noopener">
      iOS에서 받기 (App Store)
    </a>
    <a id="android-link" class="store-btn store-android" href="#" rel="noopener">
      Android에서 받기 (Play Store)
    </a>
  </div>
  <div class="footer">
    <a href="/privacy.html">개인정보 처리방침</a>
    <span>© Dear Golf</span>
  </div>

<script>
  // 스토어 URL — 출시 시 실제 App ID로 교체
  // App Store: https://apps.apple.com/kr/app/id{APP_ID}
  // Play Store: package name 기반 (app.deargolf)
  var APP_STORE_URL  = 'https://apps.apple.com/kr/app/dear-golf';
  var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=app.deargolf';

  // 버튼 링크 채우기
  document.getElementById('ios-link').href = APP_STORE_URL;
  document.getElementById('android-link').href = PLAY_STORE_URL;

  // User-Agent 감지 — 모바일이면 해당 스토어로 자동 리다이렉트
  var ua = navigator.userAgent.toLowerCase();
  var isIOS = /iphone|ipad|ipod/.test(ua) && !/windows/.test(ua);
  var isAndroid = /android/.test(ua);
  var msgEl = document.getElementById('msg');

  if (isIOS || isAndroid) {
    var targetUrl = isIOS ? APP_STORE_URL : PLAY_STORE_URL;
    msgEl.textContent = '잠시 후 스토어로 이동해요...';
    // 1.5초 후 자동 리다이렉트 (사용자가 메시지 잠깐 볼 수 있게)
    setTimeout(function() { window.location.href = targetUrl; }, 1500);
  } else {
    // PC/기타 — 양쪽 버튼만 노출
    msgEl.textContent = '아래에서 사용하시는 기기를 선택해주세요';
  }
</script>
</body>
</html>
