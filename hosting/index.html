<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dear Golf — 라운딩의 모든 순간을 더 특별하게</title>
<meta name="description" content="좋은 동반자와의 라운딩, 그날의 기록까지. Dear Golf." />
<meta property="og:title" content="Dear Golf" />
<meta property="og:description" content="라운딩의 모든 순간을 더 특별하게" />
<meta property="og:url" content="https://deargolf.app" />
<meta name="theme-color" content="#0A1820" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
  :root {
    --butter:#F5E6A8; --paleSky:#C8D9E6; --burgundy:#6B1E2A;
    --gold:#C9A84C; --gold-soft:#E2CE8E;
    --ink:#0A1820; --cream:#F4EFE3; --mist:rgba(244,239,227,0.74);
    --line:rgba(201,168,76,0.35);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family:'Pretendard','Pretendard Variable',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    color:var(--cream); background:var(--ink);
    min-height:100vh; min-height:100dvh; overflow-x:hidden;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* ── 배경: 골프장 사진(hero.jpg) 켄번스 슬로우 줌 + 다크 오버레이. 사진 없으면 그라데이션 폴백 ── */
  .bg { position:fixed; inset:0; z-index:0; overflow:hidden;
    background:radial-gradient(120% 90% at 50% 0%, #16323f 0%, #0c1d27 45%, #060f15 100%); }
  .bg-img { position:absolute; inset:0; z-index:0;
    background:url('hero.jpg') center/cover no-repeat;
    filter:contrast(1.08) saturate(1.08) brightness(1.03); }
  /* 맑은 하늘 보이게 위는 옅게, 글씨·버튼 가독성 위해 아래는 진하게 */
  .overlay { position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(85% 55% at 50% 42%, rgba(6,14,20,0.40) 0%, rgba(6,14,20,0) 70%),
      linear-gradient(180deg, rgba(10,24,32,0.20) 0%, rgba(10,24,32,0.30) 48%, rgba(7,16,22,0.82) 100%);
    box-shadow:inset 0 0 160px 40px rgba(0,0,0,0.34); }

  /* ── 삼색바 (앱 TripleStripe: butter · paleSky · burgundy) ── */
  .stripe { position:fixed; left:0; right:0; height:6px; z-index:3; display:flex; }
  .stripe.top { top:0; }
  .stripe span { flex:1; }
  .stripe .s1 { background:var(--butter); }
  .stripe .s2 { background:var(--paleSky); }
  .stripe .s3 { background:var(--burgundy); }
  .stripe.shimmer::after { content:''; position:absolute; inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
    transform:translateX(-100%); animation:sweep 6s ease-in-out 1.2s infinite; }
  @keyframes sweep { 0%{transform:translateX(-100%);} 35%,100%{transform:translateX(100%);} }

  .wrap {
    position:relative; z-index:2; flex:1 1 auto;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:36px 26px 22px;
    opacity:0; transform:translateY(16px);
    animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards;
  }
  @keyframes rise { to { opacity:1; transform:none; } }

  /* 상단 멘트 — 양옆 골드 헤어라인 (옵션1) */
  .eyebrow { display:flex; align-items:center; justify-content:center; gap:13px;
    font-family:'Pretendard','Pretendard Variable',sans-serif; font-weight:500;
    font-size:clamp(13px, 3.6vw, 15px); letter-spacing:2px; color:var(--cream); opacity:0.92; margin-bottom:13px; }
  .eyebrow::before, .eyebrow::after { content:''; display:block; height:1px; width:clamp(24px, 8vw, 46px); }
  .eyebrow::before { background:linear-gradient(90deg, transparent, rgba(201,168,76,0.7)); }
  .eyebrow::after  { background:linear-gradient(90deg, rgba(201,168,76,0.7), transparent); }
  /* 메인 워드마크 — 흰색 + 골드 후광. 뒤에 모노그램(A), 아래 캡스 서브라인(C) */
  .brand { position:relative; display:flex; flex-direction:column; align-items:center; z-index:0; }
  .wordmark { position:relative; font-family:'Lora', serif; font-style:italic; font-weight:600;
    font-size:clamp(60px, 16.5vw, 96px); line-height:1.12; padding:.04em .22em; overflow:visible;
    color:#ffffff;
    filter:drop-shadow(0 0 46px rgba(245,230,168,0.22)) drop-shadow(0 3px 16px rgba(0,0,0,0.5)) drop-shadow(0 1px 2px rgba(0,0,0,0.42)); }
  /* 뒤 그림자 워터마크 — 같은 'Dear Golf'를 살짝 아래·옆으로 흐릿하게 깔아 입체 에코 */
  .wordmark::before { content:'Dear Golf'; position:absolute; left:51%; top:56%;
    transform:translate(-50%,-50%); font:inherit; white-space:nowrap;
    color:rgba(244,239,227,0.18); filter:blur(3px); z-index:-1; pointer-events:none; }
  .brand-sub { margin-top:9px; font-family:'Pretendard','Pretendard Variable',sans-serif; font-weight:500;
    font-size:clamp(10px, 2.8vw, 12px); letter-spacing:5px; color:var(--gold-soft); opacity:0.82; padding-left:5px; }
  .mini-stripe { display:flex; width:clamp(150px, 58vw, 240px); height:3px; margin:22px 0; border-radius:2px; overflow:hidden; }
  .mini-stripe span { flex:1; }
  .tagline { font-size:clamp(16px, 4.6vw, 20px); font-weight:300; line-height:1.95;
    color:var(--mist); max-width:340px; letter-spacing:.4px; }
  .tagline b { color:var(--gold-soft); font-weight:600; }
  .subtagline { margin-top:13px; font-size:clamp(13px, 3.6vw, 15px); font-weight:300; color:var(--mist); letter-spacing:.3px; opacity:0.9; }

  .stores { margin-top:50px; display:flex; flex-direction:column; gap:12px; width:100%; max-width:280px; }
  .store-btn { display:flex; align-items:center; justify-content:center; gap:11px;
    padding:17px 22px; border-radius:14px; text-decoration:none; border:1px solid var(--line);
    background:rgba(255,255,255,0.045); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    color:var(--cream); cursor:default; transition:border-color .25s, background .25s, transform .1s; }
  .store-btn:hover { border-color:rgba(201,168,76,0.7); background:rgba(255,255,255,0.07); }
  .store-btn:active { transform:scale(0.985); }
  .store-btn .ico { width:23px; height:23px; flex:none; fill:var(--gold-soft); }
  .store-btn .txt { font-size:15px; color:var(--cream); font-weight:400; letter-spacing:.3px; white-space:nowrap; }
  .soon { margin-top:18px; font-size:12px; font-weight:300; letter-spacing:3px; color:var(--gold-soft); }

  .footer { position:relative; z-index:2; padding:0 24px 30px; text-align:center;
    font-size:12px; color:rgba(244,239,227,0.45); display:flex; flex-direction:column; gap:8px; align-items:center; }
  .footer .links a { color:rgba(244,239,227,0.6); text-decoration:none; margin:0 8px; }
  .footer .links a:hover { color:var(--gold-soft); }
  @media (max-height:680px) {
    .wrap { padding-top:22px; padding-bottom:14px; }
    .mini-stripe { margin:14px 0; }
    .brand-sub { margin-top:6px; letter-spacing:4px; }
    .subtagline { margin-top:9px; }
    .stores { margin-top:30px; gap:10px; }
    .soon { margin-top:12px; }
  }
</style>
</head>
<body>
  <div class="bg"><div class="bg-img"></div></div>
  <div class="overlay"></div>
  <div class="stripe top shimmer"><span class="s1"></span><span class="s2"></span><span class="s3"></span></div>

  <div class="wrap">
    <div class="eyebrow">골프, 더 가깝게 편리하게</div>
    <div class="brand">
      <div class="wordmark">Dear&nbsp;Golf</div>
      <div class="brand-sub">GOLF · FRIENDS · LIFE</div>
    </div>
    <div class="mini-stripe"><span class="s1" style="background:var(--butter)"></span><span class="s2" style="background:var(--paleSky)"></span><span class="s3" style="background:var(--burgundy)"></span></div>
    <div class="tagline">
      라운딩의 모든 순간을<br /><b>더 특별하게</b>
    </div>
    <div class="subtagline">좋은 동반자, 그날의 기록까지</div>

    <div class="stores">
      <!-- 출시 시: href를 실제 스토어 URL로, cursor:pointer·자동이동 주석 해제 -->
      <a class="store-btn" id="ios" aria-disabled="true">
        <svg class="ico" viewBox="0 0 24 24"><path d="M16.4 12.9c0-2 1.6-3 1.7-3.1-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3 .7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .6 1 1.4 2.1 2.4 2 .9 0 1.3-.6 2.4-.6s1.4.6 2.4.6c1 0 1.7-1 2.3-2 .7-1.1 1-2.2 1-2.2-.1 0-2-.8-1.9-3.1zM14.6 6.7c.5-.7.9-1.6.8-2.5-.8 0-1.7.5-2.3 1.2-.5.6-.9 1.5-.8 2.4.9.1 1.7-.4 2.3-1.1z"/></svg>
        <span class="txt">App Store · iOS 다운로드</span>
      </a>
      <a class="store-btn" id="and" aria-disabled="true">
        <svg class="ico" viewBox="0 0 24 24"><path d="M5 4.5l8.6 8.6L5 21.7c-.3-.2-.5-.6-.5-1V5.5c0-.4.2-.8.5-1zM15 14.5l2.6 2.6-9.4 5.3 6.8-7.9zm0-3l-6.8-7.9 9.4 5.3L15 11.5zm1.4 1.4l2.6-1.5c.6-.4.6-1.4 0-1.8l-2.6-1.5-2.1 2.4 2.1 2.4z"/></svg>
        <span class="txt">Google Play · Android 다운로드</span>
      </a>
    </div>
    <div class="soon">곧 만나요 · Coming Soon</div>
  </div>

  <div class="footer">
    <div class="links"><a href="/legal.html">이용약관</a>·<a href="/privacy.html">개인정보 처리방침</a></div>
    <span>© 2026 Dear Golf</span>
  </div>

<script>

</script>
</body>
</html>
